# FLEET CONFIG =================================================================
# RMF Fleet parameters

# fleet_manager:
#   prefix: "http://localhost:3001/"
#   timeout: 5.0
#   api_key: "api_key"
#   battery_attribute_id: "battery"

reference_coordinates:
    rmf: [[0.0, 0.0 ],
          [1.0, 1.0],
          [2.0, 2.0],
          [3.0, 3.0]]
    robot: [[0.0, 0.0 ],
          [1.0, 1.0],
          [2.0, 2.0],
          [3.0, 3.0]]

rmf_fleet:
  name: "ORO"
  limits:
    linear: [0.5, 0.75] # velocity, acceleration
    angular: [0.6, 2.0] # velocity, acceleration
  profile: # Robot profile is modelled as a circle
    footprint: 0.3 # radius in m
    vicinity: 0.5 # radius in m
  reversible: True # whether robots in this fleet can reverse
  battery_system:
    voltage: 12.0 # V
    capacity: 24.0 # Ahr
    charging_current: 5.0 # A
  mechanical_system:
    mass: 20.0 # kg
    moment_of_inertia: 10.0 #kgm^2
    friction_coefficient: 0.22
  ambient_system:
    power: 20.0 # W
  tool_system:
    power: 0.0 # W
  recharge_threshold: 0.10 # Battery level below which robots in this fleet will not operate
  recharge_soc: 1.0 # Battery level to which robots in this fleet should be charged up to during recharging tasks
  publish_fleet_state: 10.0 # Publish frequency for fleet state, ensure that it is same as robot_state_update_frequency
  account_for_battery_drain: True
  task_capabilities: # Specify the types of RMF Tasks that robots in this fleet are capable of performing
    loop: True
    delivery: True
    clean: False
  finishing_request: "park" # [park, charge, nothing]
  robots:
    # Here the user is expected to append the configuration for each robot in the fleet.
    tinyRobot1:
      charger: "tinyRobot1_charger"
    tinyRobot2:
      charger: "tinyRobot2_charger"

# DeliveryBot CONFIG =================================================================

  robots:
    # Here the user is expected to append the configuration for each robot in the
    # fleet.
    # Configuration for first robot in this fleet
    andino1:
      robot_config:
        max_delay: 15.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
      rmf_config:
        robot_state_update_frequency: 0.5
        start:
          map_name: "L1"
          waypoint: "spawn_robot1"
          orientation: 0.0 # radians
        charger:
          waypoint: "spawn_robot1"
    # Configuration for the second robot in this fleet if there is a second robot
    # Uncomment if more than one robot exists.
    andino2:
      robot_config:
        max_delay: 15.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
      rmf_config:
        robot_state_update_frequency: 0.5
        start:
          map_name: "L1"
          waypoint: "spawn_robot2"
          orientation: 0.0 # radians
        charger:
          waypoint: "spawn_robot2"
    # Configuration for third robot in this fleet
    andino3:
      robot_config:
        max_delay: 15.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
      rmf_config:
        robot_state_update_frequency: 0.5
        start:
          map_name: "L1"
          waypoint: "spawn_robot3"
          orientation: 0.0 # radians
        charger:
          waypoint: "spawn_robot3"
    # Configuration for fourth robot in this fleet
    andino4:
      robot_config:
        max_delay: 15.0 # allowed seconds of delay of the current itinerary before it gets interrupted and replanned
      rmf_config:
        robot_state_update_frequency: 0.5
        start:
          map_name: "L1"
          waypoint: "spawn_robot4"
          orientation: 0.0 # radians
        charger:
          waypoint: "spawn_robot4"

reference_coordinates:
  L1:
    rmf:
      - [4.6239, -10.0]
      - [4.8148, -14.8899]
      - [32.1555, -10.0]
    robot:
      - [-12.3, 3.2]
      - [-12.1, -2.7]
      - [ 14.7, 3.2]
